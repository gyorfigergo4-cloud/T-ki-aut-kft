<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Töki Autó · Raktár</title><link rel="stylesheet" href="/phone.css"></head><body><main><h1>TÖKI AUTÓ · Raktár</h1><p>Bevételezés telefonról · közös készlet</p><form id="login"><label>Telefonos kapcsolódási kód<input id="code" type="password" autocomplete="off" required></label><button>Kapcsolódás</button></form><section id="scanner" hidden><form id="scan"><label>Vonalkód / cikkszám / terméknév<input id="barcode" autocomplete="off" required></label><button>Keresés</button></form><button id="camera" type="button">Kamera indítása</button><button id="stop" type="button" hidden>Kamera leállítása</button><video id="video" autoplay playsinline muted hidden></video><section id="phone-results" aria-label="Termékkeresés találatai"></section><h2 id="product-name"></h2><p id="stock"></p><form id="receive" hidden><label>Bevételezendő darabszám<input id="quantity" type="number" min="1" max="1000000" step="1" value="1" required></label><button>Hozzáadás a készlethez</button></form><form id="new-product" hidden><h2>Új termék</h2><label>Terméknév<input id="name" maxlength="200" required></label><label>Cikkszám<input id="sku" maxlength="200" required></label><p>A beolvasott vonalkód ehhez a termékhez kerül.</p><button>Termék rögzítése</button></form><button id="retry" type="button" hidden>Függő művelet újrapróbálása</button><button id="logout" type="button">Kilépés</button></section><p id="status" role="status"></p></main><script src="/zxing.js"></script><script src="/phone.js"></script></body></html>
