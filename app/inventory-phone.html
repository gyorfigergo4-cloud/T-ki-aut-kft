<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Töki Autó · Raktár</title><link rel="stylesheet" href="/phone.css"></head><body><main><h1>TÖKI AUTÓ · Raktár</h1><p>Bevételezés telefonról · közös készlet</p><form id="login"><label>Telefonos kapcsolódási kód<input id="code" type="password" autocomplete="off" required></label><button>Kapcsolódás</button></form><section id="scanner" hidden><form id="scan"><label>Vonalkód / cikkszám / terméknév<input id="barcode" autocomplete="off" required></label><button>Keresés</button></form><label class="phone-auto"><input id="auto-receive" type="checkbox"> Kamerás beolvasáskor 1 db automatikus bevételezés</label><button id="camera" type="button">Kamera indítása</button><button id="photo" type="button">Fotó készítése / kép beolvasása</button><input id="photo-file" type="file" accept="image/*" capture="environment" hidden><label id="camera-device-wrap" hidden>Kamera kiválasztása<select id="camera-device"></select></label><label id="camera-zoom-wrap" hidden>Nagyítás<input id="camera-zoom" type="range"></label><button id="camera-light" type="button" hidden>Lámpa bekapcsolása</button><button id="stop" type="button" hidden>Kamera leállítása</button><div id="camera-preview" hidden><video id="video" autoplay playsinline muted hidden></video><div class="scan-guide" aria-hidden="true"></div><p class="camera-hint">A teljes vonalkód férjen a keretbe.</p></div><section id="phone-results" aria-label="Termékkeresés találatai"></section><h2 id="product-name"></h2><p id="stock"></p><form id="receive" hidden><label>Bevételezendő darabszám<input id="quantity" type="number" min="1" max="1000000" step="1" value="1" required></label><button>Hozzáadás a készlethez</button></form><section id="phone-catalog" hidden><h2>Termék választása a katalógusból</h2><form id="phone-catalog-form"><label>Gyártó / cikkszám / terméknév<input id="phone-catalog-query" type="search" placeholder="Pl. OC217/6"></label><button>Keresés a katalógusban</button></form><p id="phone-catalog-status"></p><div id="phone-catalog-results"></div><button id="phone-catalog-more" type="button" hidden>További találatok</button></section><form id="new-product" hidden><h2>Termék / vonalkód rögzítése</h2><p id="phone-catalog-selected"></p><label>Terméknév<input id="name" maxlength="200" required></label><label>Cikkszám<input id="sku" maxlength="200" required></label><p>A beolvasott vonalkód ehhez a termékhez kerül.</p><button id="phone-product-save">Termék rögzítése</button></form><button id="retry" type="button" hidden>Függő művelet újrapróbálása</button><button id="logout" type="button">Kilépés</button></section><p id="status" role="status"></p></main><script src="/zxing.js"></script><script src="/camera.js"></script><script src="/phone.js"></script></body></html>
